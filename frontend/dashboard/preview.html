<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RAGBot — Vista previa del widget</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; padding: 40px 20px;
         background: #f4f4fa; color: #1a1a2e; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.sub { color: #70708a; font-size: 14px; margin: 0 0 24px; }
  .panel { background: #fff; border: 1px solid #e5e5ef; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .panel label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .panel input { width: 100%; padding: 9px 12px; border: 1.5px solid #e5e5ef; border-radius: 8px;
                 font-size: 14px; font-family: monospace; margin-bottom: 14px; }
  .panel button { background: #6c63ff; color: #fff; border: none; padding: 10px 18px; border-radius: 8px;
                  font-size: 14px; font-weight: 600; cursor: pointer; }
  .panel button:hover { filter: brightness(1.08); }
  details summary { cursor: pointer; font-size: 13px; color: #70708a; margin-bottom: 10px; }
  #status { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
  #status.info { background: #eef0ff; color: #4338ca; }
  #status.error { background: #fef2f2; color: #b91c1c; }
  a.back { font-size: 13px; color: #6c63ff; text-decoration: none; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver al dashboard</a>
    <h1 style="margin-top:14px">🤖 Vista previa del widget</h1>
    <p class="sub">Así se ve el bot embebido como burbuja en un sitio. Es una prueba real: escribe y consume
      tokens igual que en producción.</p>

    <div id="status" class="info">Cargando…</div>

    <details id="manual">
      <summary>Cargar otro bot</summary>
      <div class="panel">
        <label for="cfg-api-url">API URL</label>
        <input id="cfg-api-url">
        <label for="cfg-bot-id">Bot ID</label>
        <input id="cfg-bot-id" placeholder="ej: 3f9a1c2e-....">
        <button onclick="loadWidget()">▶ Cargar</button>
      </div>
    </details>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
    const defaultApi = isLocal ? 'http://localhost:8040' : location.origin + '/ragbot';
    const apiInput = document.getElementById('cfg-api-url');
    const botInput = document.getElementById('cfg-bot-id');
    apiInput.value = params.get('api') || defaultApi;
    botInput.value = params.get('bot') || '';

    function setStatus(text, kind) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = kind;
      el.style.display = text ? '' : 'none';
    }

    function loadWidget() {
      const apiUrl = apiInput.value.trim().replace(/\/$/, '');
      const botId = botInput.value.trim();
      if (!botId) { setStatus('Pegá el Bot ID primero.', 'error'); return; }

      // Guarda en la URL para poder recargar o compartir el link con los mismos valores.
      const url = new URL(location.href);
      url.searchParams.set('api', apiUrl);
      url.searchParams.set('bot', botId);
      history.replaceState(null, '', url);

      // Si ya había un widget cargado, lo saca antes de meter uno nuevo.
      document.getElementById('ragbot-widget-container')?.remove();
      document.getElementById('ragbot-styles')?.remove();
      document.getElementById('ragbot-widget-script')?.remove();
      if (window.RAGBot) delete window.RAGBot;

      setStatus('Cargando widget…', 'info');
      // Usa el script real que sirve el backend para ese bot: trae la config (nombre, colores,
      // logos, avatar, API key si tiene una) ya resuelta desde el servidor — no hay nada que bajar.
      const s = document.createElement('script');
      s.id = 'ragbot-widget-script';
      s.src = `${apiUrl}/api/v1/chatbots/${encodeURIComponent(botId)}/widget.js`;
      s.onload = () => setStatus('Listo. Abrí la burbuja, abajo a la derecha.', 'info');
      s.onerror = () => setStatus(
        'No se pudo cargar el widget: revisá el Bot ID y la API URL, y que el bot esté marcado como público.',
        'error');
      document.body.appendChild(s);
    }

    document.getElementById('manual').open = !botInput.value;
    if (botInput.value) loadWidget();
    else setStatus('', '');
  </script>
</body>
</html>
