# Producción (standalone, no se combina con docker-compose.yml):
#   docker compose -f docker-compose.prod.yml up -d --build
# - Base de datos REMOTA: DATABASE_URL / DATABASE_URL_SYNC salen de backend/.env (no hay postgres local).
# - Solo el nginx interno se publica, en loopback (127.0.0.1:8080); el nginx del host
#   (subsecretar-ia.salta.gob.ar) le hace proxy en /ragbot/ (ver docs/nginx-host-ragbot.conf).
version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: ragbot_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ragbot_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # Lo único que se fuerza; el resto (DB remota, keys, SECRET_KEY, ALLOWED_ORIGINS...) viene del .env
      PYTHONPATH: /app
      REDIS_URL: redis://redis:6379/0
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - avatars_data:/app/static/avatars
      - org_logos_data:/app/static/org_logos
      - branding_data:/app/static/branding
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dashboard:
    image: nginx:alpine
    container_name: ragbot_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/dashboard:/usr/share/nginx/html:ro

  nginx:
    image: nginx:alpine
    container_name: ragbot_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - dashboard
    volumes:
      - ./docs/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:80"

volumes:
  redis_data:
  uploads_data:
  logs_data:
  avatars_data:
  org_logos_data:
  branding_data:
