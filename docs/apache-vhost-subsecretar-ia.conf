# VirtualHost propio de subsecretar-ia.salta.gob.ar
# Instalar como /etc/apache2/sites-available/subsecretar-ia.conf  (ver pasos en deploy-nodocker.sh / README)
# El snippet /etc/apache2/conf-available/ragbot.conf sale de docs/apache-ragbot.conf.

<VirtualHost *:80>
    ServerName subsecretar-ia.salta.gob.ar
    RewriteEngine On
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName subsecretar-ia.salta.gob.ar

    SSLEngine on
    # AJUSTAR: certificado válido para subsecretar-ia.salta.gob.ar
    SSLCertificateFile    /etc/ssl/certs/subsecretar-ia.salta.gob.ar.crt
    SSLCertificateKeyFile /etc/ssl/private/subsecretar-ia.salta.gob.ar.key
    # SSLCertificateChainFile /etc/ssl/certs/subsecretar-ia-chain.crt   # si aplica

    DocumentRoot /var/www/html
    Include /etc/apache2/conf-available/ragbot.conf

    ErrorLog  ${APACHE_LOG_DIR}/subsecretar-ia-error.log
    CustomLog ${APACHE_LOG_DIR}/subsecretar-ia-access.log combined
</VirtualHost>
