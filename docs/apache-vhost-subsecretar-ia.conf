# VirtualHost de subsecretar-ia.salta.gob.ar
# El TLS lo termina un equipo delante de Apache, que reenvía por HTTP al puerto 80,
# por eso no hay SSLEngine ni redirección a HTTPS acá (causaría un bucle).
# Instalar como /etc/apache2/sites-available/subsecretar-ia.conf
# El snippet /etc/apache2/conf-available/ragbot.conf sale de docs/apache-ragbot.conf.

<VirtualHost *:80>
    ServerName subsecretar-ia.salta.gob.ar

    DocumentRoot /var/www/html
    Include /etc/apache2/conf-available/ragbot.conf

    ErrorLog  ${APACHE_LOG_DIR}/subsecretar-ia-error.log
    CustomLog ${APACHE_LOG_DIR}/subsecretar-ia-access.log combined
</VirtualHost>
