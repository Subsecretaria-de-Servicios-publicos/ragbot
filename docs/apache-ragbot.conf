# Snippet de /ragbot y /matriabot: se instala en /etc/apache2/conf-available/ragbot.conf y lo
# incluye el vhost. El nombre del archivo en el servidor puede seguir siendo "ragbot.conf" —no
# hace falta renombrarlo— el contenido de acá adentro es lo que importa.
# Módulos requeridos:  sudo a2enmod proxy proxy_http headers rewrite
#
# Conviven DOS rutas a propósito: /ragbot es la ruta vieja (bots ya embebidos en sitios de
# gobierno apuntan ahí con un <script src="...ragbot/api/..."> que no se puede editar a
# distancia) y /matriabot es la nueva, la que se usa para embeber bots de acá en adelante.
# Las dos apuntan al mismo backend; no hay nada que migrar, /ragbot se puede dejar activo
# indefinidamente o sacar más adelante cuando se confirme que ya no la usa nadie.

    RedirectMatch ^/ragbot$ /ragbot/
    RedirectMatch ^/matriabot$ /matriabot/

    ProxyPreserveHost On
    # El público entra por HTTPS (TLS terminado antes de Apache)
    RequestHeader set X-Forwarded-Proto "https"
    # mod_proxy agrega X-Forwarded-For por su cuenta

    # El timeout=120 inline de ProxyPass no alcanza por sí solo para cortes en la LECTURA de
    # la respuesta en todas las versiones/configuraciones de mod_proxy — con un modelo lento
    # (ej. gpt-4o con mucho contexto) Apache cortaba la conexión bastante antes de los 120s
    # ("AH01102: error reading status line"), y el navegador recibía la página de error de
    # Apache en vez del JSON del backend. ProxyTimeout es la directiva que sí cubre todo el
    # tiempo de espera de la respuesta; se la deja explícita y más alta que el peor caso real.
    ProxyTimeout 180

    # API y archivos estáticos del backend (widget.js, avatares, logos) — ruta nueva
    ProxyPass        /matriabot/api/    http://127.0.0.1:8040/api/    timeout=180
    ProxyPassReverse /matriabot/api/    http://127.0.0.1:8040/api/
    ProxyPass        /matriabot/static/ http://127.0.0.1:8040/static/ timeout=180
    ProxyPassReverse /matriabot/static/ http://127.0.0.1:8040/static/

    # Idem, ruta vieja — se mantiene para no romper bots ya embebidos con esta URL
    ProxyPass        /ragbot/api/    http://127.0.0.1:8040/api/    timeout=180
    ProxyPassReverse /ragbot/api/    http://127.0.0.1:8040/api/
    ProxyPass        /ragbot/static/ http://127.0.0.1:8040/static/ timeout=180
    ProxyPassReverse /ragbot/static/ http://127.0.0.1:8040/static/

    # Dashboard (HTML estático) — mismo directorio servido en las dos rutas
    Alias /matriabot /home/userdes/ragbot/frontend/dashboard
    <Directory /home/userdes/ragbot/frontend/dashboard>
        Options -Indexes
        DirectoryIndex index.html
        Require all granted
    </Directory>
    Alias /ragbot /home/userdes/ragbot/frontend/dashboard

    # Subida de documentos (MAX_FILE_SIZE_MB=50)
    <Location /matriabot/api/>
        LimitRequestBody 52428800
    </Location>
    <Location /ragbot/api/>
        LimitRequestBody 52428800
    </Location>
