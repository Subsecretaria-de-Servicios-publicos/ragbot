# Agregar dentro del server { } de subsecretar-ia.salta.gob.ar en el nginx del host (172.17.32.132)

    location = /ragbot { return 301 /ragbot/; }

    location /ragbot/ {
        # La barra final en proxy_pass hace que nginx quite el prefijo /ragbot/
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50m;   # subida de documentos (MAX_FILE_SIZE_MB=50)
    }
